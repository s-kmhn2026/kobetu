<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個別の指導計画 評価記録アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // SVG Icon Component to ensure robust rendering without external font dependencies
    function Icon({ name, className = "w-5 h-5" }) {
      const icons = {
        'sun': <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41M12 7a5 5 0 100 10 5 5 0 000-10z" />,
        'book-open': <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z" />,
        'calculator': <path d="M4 2h16a2 2 0 012 2v16a2 2 0 01-2 2H4a2 2 0 01-2-2V4a2 2 0 012-2z M8 6h8 M16 14v4 M8 14h.01 M12 14h.01 M8 18h.01 M12 18h.01" />,
        'palette': <path d="M12 21a9 9 0 100-18 9 9 0 000 18z M12 8a1.5 1.5 0 110-3 1.5 1.5 0 010 3z M7.5 10.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3z M6.5 15.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3z M16.5 15.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3z" />,
        'music': <path d="M9 18V5l12-2v13 M9 18a3 3 0 11-6 0 3 3 0 016 0z M21 16a3 3 0 11-6 0 3 3 0 016 0z" />,
        'activity': <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
        'users': <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2 M9 11a4 4 0 100-8 4 4 0 000 8z M23 21v-2a4 4 0 00-3-3.87 M16 3.13a4 4 0 010 7.75" />,
        'heart': <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" />,
        'chevron-right': <path d="M9 18l6-6-6-6" />,
        'chevron-left': <path d="M15 18l-6-6 6-6" />,
        'file-text': <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8" />,
        'calendar': <><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></>,
        'book': <path d="M4 19.5A2.5 2.5 0 016.5 17H20 M4 19.5A2.5 2.5 0 006.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z" />,
        'plus': <path d="M12 5v14M5 12h14" />,
        'edit-3': <path d="M12 20h9 M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z" />,
        'info': <><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></>,
        'check': <polyline points="20 6 9 17 4 12" />,
        'sparkles': <path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z" />,
        'loader': <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />,
        'bot': <><rect x="3" y="11" width="18" height="10" rx="2" /><circle cx="12" cy="5" r="2" /><path d="M12 7v4M8 15h0 M16 15h0" /></>,
        'x': <><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>,
        'zap': <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
        'refresh-cw': <path d="M23 4v6h-6 M1 20v-6h6 M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />,
        'download': <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4 M7 10l5 5 5-5 M12 15V3" />,
        'trash-2': <><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" /></>,
        'key': <path d="M21 2l-2 2m-1.5 1.5l-3 3m-2 2l-3 3m2-2l-3-3m-4 4a6 6 0 118.49-8.49L21 2z" />,
        'alert-triangle': <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z M12 9v4 M12 17h.01" />,
        'user-plus': <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2 M9 11a4 4 0 100-8 4 4 0 000 8z M19 8v6 M22 11h-6" />,
        'home': <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
      };

      return (
        <svg 
          xmlns="http://www.w3.org/2000/svg" 
          className={className} 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          strokeWidth="2" 
          strokeLinecap="round" 
          strokeLinejoin="round"
        >
          {icons[name] || <circle cx="12" cy="12" r="10" />}
        </svg>
      );
    }

    const SUBJECTS = ['生活', '国語', '算数', '図画工作', '音楽', '体育', '特別活動', '自立活動'];

    const TERMS = ['前期', '後期'];

    const SUBJECT_COLORS = {
      '生活': 'bg-amber-100 text-amber-800 border-amber-300',
      '国語': 'bg-rose-100 text-rose-800 border-rose-300',
      '算数': 'bg-sky-100 text-sky-800 border-sky-300',
      '図画工作': 'bg-purple-100 text-purple-800 border-purple-300',
      '音楽': 'bg-pink-100 text-pink-800 border-pink-300',
      '体育': 'bg-emerald-100 text-emerald-800 border-emerald-300',
      '特別活動': 'bg-orange-100 text-orange-800 border-orange-300',
      '自立活動': 'bg-teal-100 text-teal-800 border-teal-300'
    };

    const SUBJECT_ICONS = {
      '生活': 'sun',
      '国語': 'book-open',
      '算数': 'calculator',
      '図画工作': 'palette',
      '音楽': 'music',
      '体育': 'activity',
      '特別活動': 'users',
      '自立活動': 'heart'
    };

    const INITIAL_STUDENTS = [
      { id: 's1', name: '児童A' },
      { id: 's2', name: '児童B' }
    ];

    const INITIAL_UNITS = [
      {
        id: 'u1',
        studentId: 's1',
        subject: '国語',
        term: '前期',
        title: 'ひらがなを読もう',
        startDate: '2026-09-01',
        endDate: '2026-09-30',
        goal: '教師と一緒に、ひらがなカードを見て声を出しながら発音することができる。',
        evaluation: '教師の促しでカードを見て発音し、自分の名前の文字を読もうと意欲的に取り組めました。',
        status: '確定'
      },
      {
        id: 'u1_s2',
        studentId: 's2',
        subject: '国語',
        term: '前期',
        title: 'ひらがなを読もう',
        startDate: '2026-09-01',
        endDate: '2026-09-30',
        goal: '提示されたひらがなカードの中から、自分の名前の文字を選ぶことができる。',
        evaluation: '',
        status: '未作成'
      },
      {
        id: 'u2',
        studentId: 's1',
        subject: '生活',
        term: '前期',
        title: 'あさのしたくをしよう',
        startDate: '2026-09-01',
        endDate: '',
        goal: '手順表を見ながら、自分の持ち物をロッカーに片付けることができる。',
        evaluation: '',
        status: '未作成'
      },
      {
        id: 'u2_s2',
        studentId: 's2',
        subject: '生活',
        term: '前期',
        title: 'あさのしたくをしよう',
        startDate: '2026-09-01',
        endDate: '',
        goal: '教師の助言を受けながら、帽子をフックにかけることができる。',
        evaluation: '',
        status: '未作成'
      }
    ];

    const INITIAL_LOGS = [
      {
        id: 'l1',
        unitId: 'u1',
        date: '2026-09-10',
        content: '自分の名前の最初の1文字をカードから見つけて指差し、声に出して読むことができた。'
      },
      {
        id: 'l2',
        unitId: 'u1',
        date: '2026-09-15',
        content: '知っているひらがなを見つけると自発的に声を出し、意欲的に課題に取り組む様子が見られた。'
      }
    ];

    function App() {
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('sp_students');
        return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
      });

      const [units, setUnits] = useState(() => {
        const saved = localStorage.getItem('sp_units');
        if (saved) {
          const parsed = JSON.parse(saved);
          return parsed.map(u => u.term ? u : { ...u, term: '前期' });
        }
        return INITIAL_UNITS;
      });

      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('sp_logs');
        return saved ? JSON.parse(saved) : INITIAL_LOGS;
      });

      const [apiKey, setApiKey] = useState(() => {
        return localStorage.getItem('sp_gemini_api_key') || '';
      });

      // Navigation: { view: 'dashboard' | 'student' | 'unit', studentId: null, subject: null, unitId: null }
      const [nav, setNav] = useState({ view: 'dashboard', studentId: null, subject: null, unitId: null });

      // Modals
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);
      const [showAddStudentModal, setShowAddStudentModal] = useState(false);
      const [showQuickRecordModal, setShowQuickRecordModal] = useState(false);
      const [showWordExportModal, setShowWordExportModal] = useState(false);
      const [exportStudentId, setExportStudentId] = useState(null);

      const [dialogConfig, setDialogConfig] = useState(null);
      const [addUnitSubjectTarget, setAddUnitSubjectTarget] = useState(null);
      const [renameTarget, setRenameTarget] = useState(null);

      useEffect(() => {
        localStorage.setItem('sp_students', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('sp_units', JSON.stringify(units));
      }, [units]);

      useEffect(() => {
        localStorage.setItem('sp_logs', JSON.stringify(logs));
      }, [logs]);

      const showAlert = (title, message, icon = 'info', onConfirm = null) => {
        setDialogConfig({ title, message, icon, onConfirm });
      };

      const handleSaveApiKey = (key) => {
        const trimmed = key.trim();
        setApiKey(trimmed);
        localStorage.setItem('sp_gemini_api_key', trimmed);
        setShowApiKeyModal(false);
        showAlert('APIキー保存完了', 'Gemini APIキーを保存しました。AI評価文生成機能をご利用いただけます。', 'check');
      };

      const handleAddStudent = (name) => {
        if (!name.trim()) return;
        const newStudentId = 's_' + Date.now();
        const newStudent = { id: newStudentId, name: name.trim() };
        
        const existingSubjectTitles = [];
        units.forEach(u => {
          const itemTerm = u.term || '前期';
          if (!existingSubjectTitles.some(st => st.subject === u.subject && st.title === u.title && st.term === itemTerm)) {
            existingSubjectTitles.push({ subject: u.subject, title: u.title, term: itemTerm });
          }
        });

        const newUnitsForStudent = existingSubjectTitles.map((st, idx) => ({
          id: `u_${Date.now()}_${idx}`,
          studentId: newStudentId,
          subject: st.subject,
          term: st.term,
          title: st.title,
          goal: '',
          startDate: new Date().toISOString().split('T')[0],
          endDate: '',
          evaluation: '',
          status: '未作成'
        }));

        setStudents(prev => [...prev, newStudent]);
        if (newUnitsForStudent.length > 0) {
          setUnits(prev => [...prev, ...newUnitsForStudent]);
        }
        setShowAddStudentModal(false);
      };

      const handleAddUnitToAllStudents = (subject, title, term = '前期', defaultGoal = '') => {
        if (!title.trim()) return;
        const trimmedTitle = title.trim();
        const now = Date.now();
        let targetUnitId = null;

        setUnits(prevUnits => {
          const updated = [...prevUnits];
          students.forEach((st, idx) => {
            const exists = updated.some(u => u.studentId === st.id && u.subject === subject && (u.term || '前期') === term && u.title === trimmedTitle);
            if (!exists) {
              const uId = `u_${now}_${idx}`;
              const uObj = {
                id: uId,
                studentId: st.id,
                subject,
                term,
                title: trimmedTitle,
                goal: st.id === nav.studentId ? defaultGoal : '',
                startDate: new Date().toISOString().split('T')[0],
                endDate: '',
                evaluation: '',
                status: '未作成'
              };
              updated.push(uObj);
              if (st.id === nav.studentId) {
                targetUnitId = uId;
              }
            } else if (st.id === nav.studentId) {
              const found = updated.find(u => u.studentId === st.id && u.subject === subject && (u.term || '前期') === term && u.title === trimmedTitle);
              if (found) targetUnitId = found.id;
            }
          });
          return updated;
        });

        setAddUnitSubjectTarget(null);

        if (nav.studentId && targetUnitId) {
          setNav({ view: 'unit', studentId: nav.studentId, subject, unitId: targetUnitId });
        }
      };

      const handleRenameUnitAllStudents = (subject, oldTitle, newTitle, term) => {
        if (!newTitle.trim() || oldTitle === newTitle.trim()) return;
        const trimmedNewTitle = newTitle.trim();
        setUnits(prev => prev.map(u => {
          const itemTerm = u.term || '前期';
          if (u.subject === subject && u.title === oldTitle && itemTerm === term) {
            return { ...u, title: trimmedNewTitle };
          }
          return u;
        }));
        setRenameTarget(null);
      };

      const handleUpdateUnit = (updatedUnit) => {
        setUnits(prev => prev.map(u => u.id === updatedUnit.id ? updatedUnit : u));
      };

      const handleAddLog = (unitId, content, date) => {
        const newLog = {
          id: 'l_' + Date.now(),
          unitId,
          date: date || new Date().toISOString().split('T')[0],
          content: content.trim()
        };
        setLogs(prev => [newLog, ...prev]);
      };

      const handleDeleteLog = (logId) => {
        showAlert('記録の削除', 'この日々の記録を削除してもよろしいですか？', 'alert-triangle', () => {
          setLogs(prev => prev.filter(l => l.id !== logId));
        });
      };

      const handleUpdateLog = (logId, content, date) => {
        setLogs(prev => prev.map(l => l.id === logId ? { ...l, content, date } : l));
      };

      const handleResetAllData = () => {
        showAlert('データ一括初期化', '登録されたすべての児童・単元・評価記録が削除され、初期状態に戻ります。実行しますか？', 'alert-triangle', () => {
          localStorage.removeItem('sp_students');
          localStorage.removeItem('sp_units');
          localStorage.removeItem('sp_logs');
          setStudents(INITIAL_STUDENTS);
          setUnits(INITIAL_UNITS);
          setLogs(INITIAL_LOGS);
          setNav({ view: 'dashboard', studentId: null, subject: null, unitId: null });
        });
      };

      const currentStudent = useMemo(() => students.find(s => s.id === nav.studentId), [students, nav.studentId]);
      const currentUnit = useMemo(() => units.find(u => u.id === nav.unitId), [units, nav.unitId]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* 画面ヘッダー */}
          <header className="bg-emerald-800 text-white shadow-md sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div 
                className="flex items-center gap-2 cursor-pointer hover:opacity-90 transition-opacity"
                onClick={() => setNav({ view: 'dashboard', studentId: null, subject: null, unitId: null })}
              >
                <div className="bg-white/20 p-2 rounded-xl">
                  <Icon name="book" className="w-6 h-6 text-emerald-100" />
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight">個別の指導計画 評価記録</h1>
                  <p className="text-[10px] text-emerald-200">特別支援教育 指導計画 & AI評価文作成アシスタント</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowQuickRecordModal(true)}
                  className="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 shadow transition-all active:scale-95"
                >
                  <Icon name="zap" className="w-4 h-4 fill-current" />
                  <span className="hidden sm:inline">今日の記録</span>
                </button>

                <button
                  onClick={() => setShowApiKeyModal(true)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                    apiKey ? 'bg-emerald-700 hover:bg-emerald-600 text-emerald-100' : 'bg-rose-500 hover:bg-rose-600 text-white animate-pulse'
                  }`}
                >
                  <Icon name="key" className="w-4 h-4" />
                  <span className="hidden sm:inline">{apiKey ? 'APIキー設定済み' : 'APIキー未設定'}</span>
                </button>

                <button
                  onClick={handleResetAllData}
                  className="p-1.5 hover:bg-emerald-700 rounded-xl text-emerald-200 hover:text-white transition-colors"
                  title="データを初期化"
                >
                  <Icon name="refresh-cw" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          {/* パンくずリスト */}
          {nav.view !== 'dashboard' && (
            <nav className="bg-white border-b border-slate-200 px-4 py-2.5 text-xs text-slate-600">
              <div className="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto whitespace-nowrap custom-scrollbar">
                <button
                  onClick={() => setNav({ view: 'dashboard', studentId: null, subject: null, unitId: null })}
                  className="hover:text-emerald-700 flex items-center gap-1 font-semibold"
                >
                  <Icon name="home" className="w-3.5 h-3.5" />
                  <span>児童一覧</span>
                </button>

                {currentStudent && (
                  <>
                    <Icon name="chevron-right" className="w-3.5 h-3.5 text-slate-400 shrink-0" />
                    <button
                      onClick={() => setNav({ view: 'student', studentId: currentStudent.id, subject: null, unitId: null })}
                      className={`font-semibold ${nav.view === 'student' ? 'text-emerald-800 font-bold' : 'hover:text-emerald-700'}`}
                    >
                      {currentStudent.name}
                    </button>
                  </>
                )}

                {nav.subject && (
                  <>
                    <Icon name="chevron-right" className="w-3.5 h-3.5 text-slate-400 shrink-0" />
                    <span className="font-semibold text-slate-700">{nav.subject}</span>
                  </>
                )}

                {currentUnit && (
                  <>
                    <Icon name="chevron-right" className="w-3.5 h-3.5 text-slate-400 shrink-0" />
                    <span className="font-bold text-emerald-800 truncate max-w-[150px] sm:max-w-[200px]">
                      [{currentUnit.term || '前期'}] {currentUnit.title}
                    </span>
                  </>
                )}
              </div>
            </nav>
          )}

          {/* メインコンテンツ表示エリア */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            {nav.view === 'dashboard' && (
              <DashboardView 
                students={students}
                units={units}
                logs={logs}
                onSelectStudent={(sId) => setNav({ view: 'student', studentId: sId, subject: null, unitId: null })}
                onAddStudent={() => setShowAddStudentModal(true)}
              />
            )}

            {nav.view === 'student' && currentStudent && (
              <StudentDetailView 
                student={currentStudent}
                units={units.filter(u => u.studentId === currentStudent.id)}
                onSelectUnit={(unitId, subject) => setNav({ view: 'unit', studentId: currentStudent.id, subject, unitId })}
                onAddUnit={(subject, term) => setAddUnitSubjectTarget({ subject, term })}
                onTriggerRenameAll={(subject, title, term) => setRenameTarget({ subject, oldTitle: title, term })}
                onOpenExport={() => {
                  setExportStudentId(currentStudent.id);
                  setShowWordExportModal(true);
                }}
              />
            )}

            {nav.view === 'unit' && currentUnit && (
              <UnitDetailView 
                unit={currentUnit}
                student={currentStudent}
                logs={logs.filter(l => l.unitId === currentUnit.id)}
                apiKey={apiKey}
                showAlert={showAlert}
                onOpenApiKeyModal={() => setShowApiKeyModal(true)}
                onUpdateUnit={handleUpdateUnit}
                onRenameUnitAll={handleRenameUnitAllStudents}
                onAddLog={(content, date) => handleAddLog(currentUnit.id, content, date)}
                onDeleteLog={handleDeleteLog}

    function UnitDetailView({ unit, student, logs, apiKey, showAlert, onOpenApiKeyModal, onUpdateUnit, onRenameUnitAll, onAddLog, onDeleteLog, onUpdateLog }) {
      const [goalInput, setGoalInput] = useState(unit.goal || '');
      const [isEditingGoal, setIsEditingGoal] = useState(!unit.goal);
      const [isEditingUnitTitle, setIsEditingUnitTitle] = useState(false);
      const [unitTitleInput, setUnitTitleInput] = useState(unit.title);

      const [logInput, setLogInput] = useState('');
      const [logDate, setLogDate] = useState(new Date().toISOString().split('T')[0]);

      const [aiEvaluation, setAiEvaluation] = useState(unit.evaluation || '');
      const [isGenerating, setIsGenerating] = useState(false);
      const [isEditingEval, setIsEditingEval] = useState(false);

      const [editingLogId, setEditingLogId] = useState(null);
      const [editLogContent, setEditLogContent] = useState('');
      const [editLogDate, setEditLogDate] = useState('');

      const unitTerm = unit.term || '前期';

      useEffect(() => {
        setGoalInput(unit.goal || '');
        setAiEvaluation(unit.evaluation || '');
        setUnitTitleInput(unit.title);
      }, [unit.id, unit.title]);

      const handleSaveUnitTitle = () => {
        if (!unitTitleInput.trim()) return;
        onRenameUnitAll(unit.subject, unit.title, unitTitleInput.trim(), unitTerm);
        setIsEditingUnitTitle(false);
      };

      const handleEvalChange = (e) => {
        const newVal = e.target.value;
        setAiEvaluation(newVal);
        onUpdateUnit({ ...unit, evaluation: newVal, status: unit.status === '未作成' ? '下書き' : unit.status });
      };

      const handleSaveGoal = () => {
        onUpdateUnit({ ...unit, goal: goalInput });
        setIsEditingGoal(false);
      };

      const handleAddRecord = (e) => {
        e.preventDefault();
        if (!logInput.trim()) return;
        onAddLog(logInput.trim(), logDate);
        setLogInput('');
      };

      const handleGenerateAIEvaluation = async () => {
        if (!apiKey) {
          showAlert('APIキー未設定', 'Gemini APIキーが設定されていません。「APIキー未設定」ボタンからAPIキーを入力してください。', 'alert-triangle');
          onOpenApiKeyModal();
          return;
        }

        if (logs.length === 0) {
          showAlert('記録なし', '日々の記録がありません。評価文を作成するにはまず日々の記録を入力してください。', 'info');
          return;
        }

        setIsGenerating(true);

        const logsText = logs.map(l => `・[${l.date}] ${l.content}`).join('\n');
        
        const systemPrompt = `あなたは特別支援学校の教員です。児童の様子を温かくかつ客観的に把握し、保護者や関係機関にも分かりやすい評価文を作成します。文章は必ず「です・ます調（敬体）」で統一してください。個人特定につながる表記は避け、一般的な教育用語を用いて記載してください。`;
        
        const userPrompt = `以下の情報を基に、個別の指導計画に記載する評価文を作成してください。

【対象期】
${unitTerm}

【単元名】
${unit.title}

【個人目標】
${unit.goal || '（未設定）'}

【日々の記録】
${logsText}

以下の条件を必ず守ってください。
1．日々の記録に書かれている事実だけを基にすること
2．記録にない事実や成果を追加しないこと
3．児童の変化や成長、必要だった支援を含めて記述すること
4．個別の指導計画に適した丁寧で客観的な文章にすること
5．否定的な表現ではなく、できたことや取り組みの変化を中心に表現すること
6．必ず「70文字以上、100文字以内」で簡潔にまとめること（絶対に100文字を超えないこと）
7．文章の語尾は必ず丁寧な「敬体（です・ます調）」にすること（例: 〜取り組みました。〜が見られます。）

評価文のみを出力してください。`;

        try {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey.trim()}`;

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userPrompt }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] }
            })
          });

          const data = await response.json();

          if (data.error) {
            showAlert('APIエラー', `エラーが発生しました:\n${data.error.message || 'APIキーが無効またはエラーが発生しました。'}`, 'alert-triangle');
            setIsGenerating(false);
            return;
          }

          const generatedText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

          if (generatedText) {
            const trimmedText = generatedText.trim();
            setAiEvaluation(trimmedText);
            onUpdateUnit({ ...unit, evaluation: trimmedText, status: '下書き' });
          } else {
            showAlert('生成エラー', 'AIによる評価文の生成に失敗しました。もう一度お試しください。', 'alert-triangle');
          }
        } catch (error) {
          console.error("AI Generation Error:", error);
          showAlert('通信エラー', '通信エラーが発生しました。APIキーまたはネットワーク状態を確認してください。', 'alert-triangle');
        } finally {
          setIsGenerating(false);
        }
      };

      const handleSaveEvaluationStatus = (status) => {
        onUpdateUnit({ ...unit, evaluation: aiEvaluation, status });
        setIsEditingEval(false);
        showAlert('保存完了', `評価文の状態を「${status}」に更新しました。`, 'check');

            <div className="flex items-center justify-between border-b border-slate-100 pb-3">

                  {unit.subject}
                </span>
                <span className="text-xs font-bold text-slate-700 bg-slate-100 px-2.5 py-1 rounded-xl border border-slate-200">
                  {unitTerm}
                </span>
                <span className="text-xs text-slate-500 font-bold">{student.name}</span>
              </div>
              <span className={`text-xs font-bold px-3 py-1 rounded-full border ${
                unit.status === '確定' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' :
                unit.status === '下書き' ? 'bg-amber-100 text-amber-800 border-amber-300' :
                'bg-slate-200 text-slate-600 border-slate-300'
              }`}>
                評価状態: {unit.status}
              </span>
            </div>

            <div>
              {isEditingUnitTitle ? (
                <div className="space-y-3 bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-300 shadow-xs">
                  <div className="text-xs font-bold text-emerald-900 flex items-center gap-1.5">
                    <Icon name="info" className="w-4 h-4 text-emerald-600 shrink-0" />
                    <span>単元名の変更は【全児童の「{unit.subject}（{unitTerm}）」教科】に一括適用されます</span>
                  </div>
                  <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                    <input
                      type="text"

                      onChange={(e) => setUnitTitleInput(e.target.value)}

                      placeholder="単元名を入力..."
                      autoFocus

                    <div className="flex items-center gap-2 shrink-0">
                      <button
                        onClick={handleSaveUnitTitle}

                      <button

              <div className="flex items-center justify-between">

    function QuickRecordModal({ students, units, subjects, showAlert, onClose, onSaveLog, onCreateUnitAndLog }) {
      const [selectedStudentId, setSelectedStudentId] = useState(students[0]?.id || '');
      const [selectedSubject, setSelectedSubject] = useState(subjects[0]);
      
      const getInitialTermByDate = (dStr) => {
        if (!dStr) return '前期';
        const month = new Date(dStr).getMonth() + 1;
        return (month >= 4 && month <= 9) ? '前期' : '後期';
      };

      const [logDate, setLogDate] = useState(new Date().toISOString().split('T')[0]);
      const [selectedTerm, setSelectedTerm] = useState(getInitialTermByDate(new Date().toISOString().split('T')[0]));
      const [selectedUnitId, setSelectedUnitId] = useState('');
      const [newUnitTitle, setNewUnitTitle] = useState('');
      const [newUnitGoal, setNewUnitGoal] = useState('');
      const [logContent, setLogContent] = useState('');

      const availableUnits = units.filter(u => u.studentId === selectedStudentId && u.subject === selectedSubject && (u.term || '前期') === selectedTerm);

      useEffect(() => {
        if (availableUnits.length > 0) {
          setSelectedUnitId(availableUnits[0].id);
        } else {
          setSelectedUnitId('new');
        }
      }, [selectedStudentId, selectedSubject, selectedTerm]);

      const handleDateChange = (newD) => {
        setLogDate(newD);
        setSelectedTerm(getInitialTermByDate(newD));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!logContent.trim()) return;

        if (selectedUnitId === 'new') {
          if (!newUnitTitle.trim()) {
            showAlert('入力エラー', '新しい単元名を入力してください。', 'alert-triangle');
            return;
          }
          onCreateUnitAndLog(selectedStudentId, selectedSubject, newUnitTitle.trim(), selectedTerm, newUnitGoal.trim(), logContent.trim(), logDate);
        } else {
          onSaveLog(selectedUnitId, logContent.trim(), logDate);
        }
      };

        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto">

                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">対象期</label>
                  <select

                    className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold"
                  >
                    <option value="前期">前期（4月〜9月）</option>
                    <option value="後期">後期（10月〜3月）</option>

              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">児童を選択</label>

                >

                  className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm min-h-[90px] focus:ring-2 focus:ring-amber-400"
                ></textarea>
              </div>

              <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button

                  onClick={onClose}
                  className="px-4 py-2 rounded-xl text-slate-600 bg-slate-100 font-bold text-xs"
                >

                <button

          </div>
        </div>

    function WordExportModal({ student, units, subjects, showAlert, onClose }) {
      const [exportTerm, setExportTerm] = useState('すべて');
      const [onlyConfirmed, setOnlyConfirmed] = useState(true);
      const [isExporting, setIsExporting] = useState(false);

      const currentDateStr = new Date().toLocaleDateString('ja-JP', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      const handleDownloadWord = async () => {
        setIsExporting(true);

        try {
          const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType } = window.docx;

          const filteredUnits = units.filter(u => {
            const matchStatus = onlyConfirmed ? u.status === '確定' : true;
            const matchTerm = exportTerm === 'すべて' ? true : (u.term || '前期') === exportTerm;
            return matchStatus && matchTerm;
          });

          const tableRows = [
            new TableRow({
              children: [
                new TableCell({
                  width: { size: 15, type: WidthType.PERCENTAGE },
                  children: [new Paragraph({ children: [new TextRun({ text: "教科・期", bold: true })] })],
                  shading: { fill: "E2EFDA" },
                }),
                new TableCell({
                  width: { size: 25, type: WidthType.PERCENTAGE },
                  children: [new Paragraph({ children: [new TextRun({ text: "単元名・個人目標", bold: true })] })],
                  shading: { fill: "E2EFDA" },
                }),
                new TableCell({
                  width: { size: 60, type: WidthType.PERCENTAGE },
                  children: [new Paragraph({ children: [new TextRun({ text: "評価", bold: true })] })],
                  shading: { fill: "E2EFDA" },
                }),
              ],
            }),
          ];

          subjects.forEach(subject => {
            const subjectUnits = filteredUnits.filter(u => u.subject === subject);

            if (subjectUnits.length === 0) {
              tableRows.push(
                new TableRow({
                  children: [
                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: subject, bold: true })] })] }),
                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "（未登録）", italics: true, color: "888888" })] })] }),
                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "（未登録）", italics: true, color: "888888" })] })] }),
                  ],
                })
              );
            } else {
              subjectUnits.forEach(u => {
                tableRows.push(
                  new TableRow({
                    children: [
                      new TableCell({
                        children: [
                          new Paragraph({ children: [new TextRun({ text: subject, bold: true })] }),
                          new Paragraph({ children: [new TextRun({ text: `[${u.term || '前期'}]`, color: "555555" })] })
                        ],
                      }),
                      new TableCell({
                        children: [
                          new Paragraph({ children: [new TextRun({ text: `【単元】${u.title}`, bold: true })] }),
                          new Paragraph({ children: [new TextRun({ text: `【目標】${u.goal || '（未設定）'}` })] }),
                        ],
                      }),
                      new TableCell({
                        children: [
                          new Paragraph({
                            children: [new TextRun({ text: u.evaluation || '（評価未作成）' })]
                          })
                        ],
                      }),
                    ],
                  })
                );
              });
            }
          });

          const doc = new Document({
            sections: [
              {
                properties: {},
                children: [
                  new Paragraph({
                    text: "個別の指導計画 評価記録",
                    heading: "Heading1",
                    alignment: AlignmentType.CENTER,
                  }),
                  new Paragraph({ text: "" }),
                  new Paragraph({
                    children: [
                      new TextRun({ text: `対象: `, bold: true }),
                      new TextRun({ text: `${student.name}  ` }),
                      new TextRun({ text: `対象期: `, bold: true }),
                      new TextRun({ text: `${exportTerm}  ` }),
                      new TextRun({ text: `出力日: `, bold: true }),
                      new TextRun({ text: `${currentDateStr}` }),
                    ],
                    alignment: AlignmentType.RIGHT,
                  }),
                  new Paragraph({ text: "" }),
                  new Table({
                    rows: tableRows,
                    width: { size: 100, type: WidthType.PERCENTAGE },
                  }),
                ],
              },
            ],
          });

          const blob = await Packer.toBlob(doc);
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `個別の指導計画_${student.name}_${exportTerm}_${new Date().toISOString().split('T')[0]}.docx`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (err) {
          console.error("Word Document Generation Error:", err);
          showAlert('出力エラー', 'Wordファイルの生成に失敗しました。', 'alert-triangle');
        } finally {
          setIsExporting(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-5 my-8">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                <Icon name="file-text" className="w-5 h-5 text-emerald-600" />
                個別の指導計画 出力 (Word)
              </h3>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-slate-100 text-slate-400">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="bg-emerald-50 rounded-2xl p-4 border border-emerald-100 space-y-3">
              <div className="flex items-center justify-between flex-wrap gap-2">
                <span className="font-bold text-sm text-slate-700">対象: {student.name}</span>
                <span className="text-xs text-slate-500">出力日: {currentDateStr}</span>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">出力する期を選択</label>
                <div className="grid grid-cols-3 gap-2">
                  {['すべて', '前期', '後期'].map(t => (
                    <button
                      key={t}
                      onClick={() => setExportTerm(t)}
                      className={`py-2 rounded-xl text-xs font-bold border transition-all ${
                        exportTerm === t
                          ? 'bg-emerald-600 text-white border-emerald-600 shadow-2xs'
                          : 'bg-white text-slate-700 border-slate-200 hover:bg-emerald-100/50'
                      }`}
                    >
                      {t}
                    </button>
                  ))}
                </div>
              </div>

              <label className="flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer pt-1">
                <input
                  type="checkbox"
                  checked={onlyConfirmed}
                  onChange={(e) => setOnlyConfirmed(e.target.checked)}
                  className="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500"
                />
                <span>「確定済み」の評価のみ出力する（チェックを外すと下書きも含む）</span>
              </label>
            </div>

            <div className="space-y-2">
              <h4 className="text-xs font-bold text-slate-500 uppercase">出力内容プレビュー ({exportTerm})</h4>
              <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 max-h-[240px] overflow-y-auto custom-scrollbar text-xs space-y-3">
                {subjects.map(subj => {
                  const targetUnits = units.filter(u => {
                    const matchStatus = onlyConfirmed ? u.status === '確定' : true;
                    const matchTerm = exportTerm === 'すべて' ? true : (u.term || '前期') === exportTerm;
                    return u.subject === subj && matchStatus && matchTerm;
                  });
                  return (
                    <div key={subj} className="border-b border-slate-200 pb-2">
                      <div className="font-bold text-emerald-800 mb-1">【{subj}】</div>
                      {targetUnits.length === 0 ? (
                        <div className="text-slate-400 italic">該当する指導評価がありません</div>
                      ) : (
                        targetUnits.map(u => (
                          <div key={u.id} className="ml-2 space-y-0.5 mb-2">
                            <div className="font-bold text-slate-700">[{u.term || '前期'}] 単元: {u.title}</div>
                            <div className="text-slate-600">目標: {u.goal || '（未設定）'}</div>
                            <div className="text-slate-800 bg-white p-2 rounded border border-slate-200 mt-1">
                              評価: {u.evaluation || '（未作成）'}
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="flex items-center justify-end gap-3 pt-2">
              <button
                onClick={onClose}
                className="px-4 py-2 rounded-xl text-slate-600 bg-slate-100 font-bold text-xs"
              >
                キャンセル
              </button>
              <button
                onClick={handleDownloadWord}
                disabled={isExporting}
                className="px-6 py-2.5 rounded-xl text-white bg-emerald-700 hover:bg-emerald-800 font-bold text-xs shadow flex items-center gap-2 active:scale-95"
              >
                <Icon name="download" className="w-4 h-4" />
                <span>{isExporting ? '生成中...' : 'Word (.docx) をダウンロード'}</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    function AddStudentModal({ onClose, onAdd }) {
      const [name, setName] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onAdd(name.trim());
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                <Icon name="user-plus" className="w-5 h-5 text-emerald-600" />
                児童の追加
              </h3>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-slate-100 text-slate-400">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">児童名・識別名</label>
                <input
                  type="text"
                  placeholder="例: 児童C"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold focus:ring-2 focus:ring-emerald-500"
                  autoFocus
                />
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl text-slate-600 bg-slate-100 font-bold text-xs"
                >
                  キャンセル
                </button>
                <button
                  type="submit"
                  disabled={!name.trim()}
                  className="px-5 py-2 rounded-xl text-white bg-emerald-600 hover:bg-emerald-700 font-bold text-xs shadow-2xs"
                >
                  追加する
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function ApiKeyModal({ currentApiKey, onClose, onSave }) {
      const [key, setKey] = useState(currentApiKey);

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                <Icon name="key" className="w-5 h-5 text-emerald-600" />
                Gemini APIキー設定
              </h3>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-slate-100 text-slate-400">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <p className="text-xs text-slate-600 leading-relaxed">
              Google AI Studioから取得した Geminii API キー（`AIzaSy...`）を入力してください。APIキーはブラウザの localStorage にのみ安全に保存されます。
            </p>

            <div>
              <input
                type="password"
                placeholder="APIキーを入力 (AIzaSy...)"
                value={key}
                onChange={(e) => setKey(e.target.value)}
                className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-mono focus:ring-2 focus:ring-emerald-500"
              />
            </div>

            <div className="flex justify-end gap-2 pt-2">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2.5 rounded-xl text-slate-600 bg-slate-100 font-bold text-xs"
              >
                キャンセル
              </button>
              <button
                onClick={() => onSave(key)}
                className="px-5 py-2.5 rounded-xl text-white bg-emerald-600 hover:bg-emerald-700 font-bold text-xs shadow-2xs"
              >
                保存する
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CustomDialogModal({ config, onClose }) {
      if (!config) return null;

      const handleConfirm = () => {
        if (config.onConfirm) {
          config.onConfirm();
        }
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
            <div className="flex items-center gap-3">
              <div className={`p-2.5 rounded-2xl ${
                config.icon === 'alert-triangle' ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-600'
              }`}>
                <Icon name={config.icon || 'info'} className="w-6 h-6" />
              </div>
              <h3 className="font-bold text-lg text-slate-800">{config.title}</h3>
            </div>

            <p className="text-xs text-slate-600 leading-relaxed whitespace-pre-wrap">
              {config.message}
            </p>

            <div className="flex justify-end gap-2 pt-2">
              {config.onConfirm && (
                <button
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl text-slate-600 bg-slate-100 font-bold text-xs"
                >
                  キャンセル
                </button>
              )}
              <button
                onClick={handleConfirm}
                className="px-5 py-2 rounded-xl text-white bg-emerald-600 hover:bg-emerald-700 font-bold text-xs shadow-2xs"
              >
                {config.onConfirm ? '実行する' : 'OK'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
