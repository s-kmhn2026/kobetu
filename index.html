        'book-open': <React.Fragment><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></React.Fragment>,
        'sun': <React.Fragment><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></React.Fragment>,

        'calendar': <React.Fragment><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></React.Fragment>,
        'x': <React.Fragment><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></React.Fragment>,
        'download': <React.Fragment><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></React.Fragment>,
        'smile': <React.Fragment><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></React.Fragment>,
        'shield-check': <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4"/>,
        'refresh-cw': <React.Fragment><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></React.Fragment>,
        'key': <React.Fragment><path d="M21 2l-2 2m-1.5 1.5l-3 3m-2 2l-3 3m-2 2l-3.5 3.5a2.121 2.121 0 0 1-3 0 2.121 2.121 0 0 1 0-3L8 11.5m3-3.5l1.5-1.5m2 2l1.5-1.5"/><circle cx="16.5" cy="7.5" r="3.5"/></React.Fragment>

        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

    const SUBJECTS = ['生活', '国語', '算数', '図画工作', '音楽', '体育', '特別活動', '自立活動'];

    const SUBJECT_COLORS = {
      '生活': 'bg-amber-100 text-amber-800 border-amber-300 hover:bg-amber-200',
      '国語': 'bg-rose-100 text-rose-800 border-rose-300 hover:bg-rose-200',
      '算数': 'bg-sky-100 text-sky-800 border-sky-300 hover:bg-sky-200',
      '図画工作': 'bg-purple-100 text-purple-800 border-purple-300 hover:bg-purple-200',
      '音楽': 'bg-pink-100 text-pink-800 border-pink-300 hover:bg-pink-200',
      '体育': 'bg-orange-100 text-orange-800 border-orange-300 hover:bg-orange-200',
      '特別活動': 'bg-emerald-100 text-emerald-800 border-emerald-300 hover:bg-emerald-200',
      '自立活動': 'bg-indigo-100 text-indigo-800 border-indigo-300 hover:bg-indigo-200'
    };

    const SUBJECT_ICONS = {
      '生活': 'sun',
      '国語': 'book-open',
      '算数': 'calculator',
      '図画工作': 'palette',
      '音楽': 'music',
      '体育': 'activity',
      '特別活動': 'users',
      '自立活動': 'heart'
    };

    const INITIAL_STUDENTS = [
      { id: 's1', name: '児童A' },
      { id: 's2', name: '児童B' }
    ];

    const INITIAL_UNITS = [
      {
        id: 'u1',
        studentId: 's1',
        subject: '国語',
        title: 'ひらがなを読もう',
        startDate: '2026-09-01',

        status: '確定'
      },
      {
        id: 'u1_s2',
        studentId: 's2',
        subject: '国語',
        title: 'ひらがなを読もう',
        startDate: '2026-09-01',
        endDate: '2026-09-30',
        goal: '提示されたひらがなカードの中から、自分の名前の文字を選ぶことができる。',
        evaluation: '',
        status: '未作成'
      },
      {
        id: 'u2',
        studentId: 's1',
        subject: '生活',
        title: 'あさのしたくをしよう',
        startDate: '2026-09-01',
        endDate: '',
        goal: '手順表を見ながら、自分の持ち物をロッカーに片付けることができる。',
        evaluation: '',
        status: '未作成'
      },
      {
        id: 'u2_s2',
        studentId: 's2',
        subject: '生活',
        title: 'あさのしたくをしよう',
        startDate: '2026-09-01',
        endDate: '',
        goal: '教師の助言を受けながら、帽子をフックにかけることができる。',
        evaluation: '',
        status: '未作成'
      }
    ];

    const INITIAL_LOGS = [
      {
        id: 'l1',
        unitId: 'u1',
        date: '2026-09-02',
        content: '「あ」「い」「う」のカードを提示すると、教師の口元をしっかり見て真似して発音することができました。'
      },
      {
        id: 'l2',
        unitId: 'u1',
        date: '2026-09-08',
        content: '自分の名前の最初の文字のカードを見せると、自分から嬉しそうに「あ！」と声に出せました。'
      },
      {
        id: 'l3',
        unitId: 'u2',
        date: '2026-09-10',
        content: 'ランドセルから連絡袋を出す際、手順表の1番目を指さしながら一人で行うことができました。'
      }
    ];

    function App() {
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('sp_students');
        return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
      });

      const [units, setUnits] = useState(() => {
        const saved = localStorage.getItem('sp_units');
        return saved ? JSON.parse(saved) : INITIAL_UNITS;
      });

      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('sp_logs');
        return saved ? JSON.parse(saved) : INITIAL_LOGS;
      });

      const [apiKey, setApiKey] = useState(() => {
        return localStorage.getItem('sp_gemini_api_key') || '';
      });

      const [lastSavedTime, setLastSavedTime] = useState(null);
      const [nav, setNav] = useState({ view: 'top', studentId: null, subject: null, unitId: null });

      // モーダル管理
      const [showQuickRecordModal, setShowQuickRecordModal] = useState(false);
      const [showAddStudentModal, setShowAddStudentModal] = useState(false);
      const [showWordExportModal, setShowWordExportModal] = useState(false);
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);
      const [exportStudentId, setExportStudentId] = useState(null);

      // 単元追加モーダルの教科ターゲット
      const [addUnitSubjectTarget, setAddUnitSubjectTarget] = useState(null);

      // 単元一括変更ダイアログ
      const [renameTarget, setRenameTarget] = useState(null);

      useEffect(() => {
        localStorage.setItem('sp_students', JSON.stringify(students));
        setLastSavedTime(new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('sp_units', JSON.stringify(units));
        setLastSavedTime(new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
      }, [units]);

      useEffect(() => {
        localStorage.setItem('sp_logs', JSON.stringify(logs));
        setLastSavedTime(new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
      }, [logs]);

      const handleSaveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('sp_gemini_api_key', key);
        setShowApiKeyModal(false);
      };

      const handleClearAllLocalData = () => {
        if (confirm('【端末内データの完全消去】\nブラウザに保存されているすべての児童データ・記録・APIキーを消去します。\n共用PCでの利用終了時やデータリセット時に実行してください。本当に消去しますか？')) {
          localStorage.removeItem('sp_students');
          localStorage.removeItem('sp_units');
          localStorage.removeItem('sp_logs');
          localStorage.removeItem('sp_gemini_api_key');
          setStudents([]);
          setUnits([]);
          setLogs([]);
          setApiKey('');
          setNav({ view: 'top', studentId: null, subject: null, unitId: null });
          alert('端末内のデータをすべて消去しました。');
        }
      };

      const handleAddStudent = (name) => {
        if (!name.trim()) return;
        const newStudentId = 's_' + Date.now();
        const newStudent = { id: newStudentId, name: name.trim() };
        
        const existingSubjectTitles = [];
        units.forEach(u => {
          if (!existingSubjectTitles.some(st => st.subject === u.subject && st.title === u.title)) {
            existingSubjectTitles.push({ subject: u.subject, title: u.title });
          }
        });

        const newUnitsForStudent = existingSubjectTitles.map((st, idx) => ({
          id: `u_${Date.now()}_${idx}`,
          studentId: newStudentId,
          subject: st.subject,
          title: st.title,
          goal: '',
          startDate: new Date().toISOString().split('T')[0],
          endDate: '',
          evaluation: '',
          status: '未作成'
        }));

        setStudents(prev => [...prev, newStudent]);
        if (newUnitsForStudent.length > 0) {
          setUnits(prev => [...prev, ...newUnitsForStudent]);
        }
        setShowAddStudentModal(false);
      };

      const handleAddUnitToAllStudents = (subject, title, defaultGoal = '') => {
        if (!title.trim()) return;
        const trimmedTitle = title.trim();
        const now = Date.now();
        let targetUnitId = null;

        setUnits(prevUnits => {
          const updated = [...prevUnits];
          students.forEach((st, idx) => {
            const exists = updated.some(u => u.studentId === st.id && u.subject === subject && u.title === trimmedTitle);
            if (!exists) {
              const uId = `u_${now}_${idx}`;
              const uObj = {
                id: uId,
                studentId: st.id,
                subject,
                title: trimmedTitle,
                goal: st.id === nav.studentId ? defaultGoal : '',
                startDate: new Date().toISOString().split('T')[0],
                endDate: '',
                evaluation: '',
                status: '未作成'
              };
              updated.push(uObj);
              if (st.id === nav.studentId) {
                targetUnitId = uId;
              }
            } else if (st.id === nav.studentId) {
              const found = updated.find(u => u.studentId === st.id && u.subject === subject && u.title === trimmedTitle);
              if (found) targetUnitId = found.id;
            }
          });
          return updated;
        });

        setAddUnitSubjectTarget(null);

        if (nav.studentId && targetUnitId) {
          setNav({ view: 'unit', studentId: nav.studentId, subject, unitId: targetUnitId });
        }
      };

      const handleRenameUnitAllStudents = (subject, oldTitle, newTitle) => {
        if (!newTitle.trim() || oldTitle === newTitle.trim()) return;
        const trimmedNewTitle = newTitle.trim();
        setUnits(prev => prev.map(u => {
          if (u.subject === subject && u.title === oldTitle) {
            return { ...u, title: trimmedNewTitle };
          }
          return u;
        }));
        setRenameTarget(null);
      };

      const handleUpdateUnit = (updatedUnit) => {
        setUnits(prev => prev.map(u => u.id === updatedUnit.id ? updatedUnit : u));
      };

      const handleAddLog = (unitId, content, date) => {
        const newLog = {
          id: 'l_' + Date.now(),
          unitId,
          date: date || new Date().toISOString().split('T')[0],
          content
        };
        setLogs(prev => [newLog, ...prev]);
      };

      const handleDeleteLog = (logId) => {
        setLogs(prev => prev.filter(l => l.id !== logId));
      };

      const handleUpdateLog = (logId, newContent, newDate) => {
        setLogs(prev => prev.map(l => l.id === logId ? { ...l, content: newContent, date: newDate } : l));
      };

      const currentStudent = students.find(s => s.id === nav.studentId);
      const currentUnit = units.find(u => u.id === nav.unitId);

      return (
        <div className="max-w-4xl mx-auto px-4 py-4 sm:px-6">
          {/* ヘッダー */}
          <header className="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-emerald-100 mb-6 gap-3">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setNav({ view: 'top', studentId: null, subject: null, unitId: null })}>
              <div className="bg-emerald-500 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center">
                <Icon name="file-badge" className="w-6 h-6" />
              </div>
              <div>
                <h1 className="font-bold text-lg text-slate-800 leading-tight">個別の指導計画 評価記録</h1>
                <p className="text-xs text-slate-500">端末内完全処理版（ローカル保存）</p>
              </div>
            </div>

            <div className="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-2 flex-wrap">
              <button
                onClick={() => setShowApiKeyModal(true)}
                className={`font-medium px-3 py-2 rounded-xl transition-all flex items-center gap-1.5 text-xs shrink-0 border ${
                  apiKey 
                    ? 'bg-emerald-50 text-emerald-700 border-emerald-300 hover:bg-emerald-100' 
                    : 'bg-rose-50 text-rose-700 border-rose-300 hover:bg-rose-100 animate-pulse'
                }`}
                title="Gemini APIキーを設定"
              >
                <Icon name="key" className="w-3.5 h-3.5" />
                <span>{apiKey ? 'APIキー設定済' : 'APIキー未設定'}</span>
              </button>

    function UnitDetailView({ unit, student, logs, apiKey, onOpenApiKeyModal, onUpdateUnit, onRenameUnitAll, onAddLog, onDeleteLog, onUpdateLog }) {
      const [goalInput, setGoalInput] = useState(unit.goal || '');
      const [isEditingGoal, setIsEditingGoal] = useState(!unit.goal);
      const [isEditingUnitTitle, setIsEditingUnitTitle] = useState(false);
      const [unitTitleInput, setUnitTitleInput] = useState(unit.title);

      const [logInput, setLogInput] = useState('');
      const [logDate, setLogDate] = useState(new Date().toISOString().split('T')[0]);

      const [aiEvaluation, setAiEvaluation] = useState(unit.evaluation || '');
      const [isGenerating, setIsGenerating] = useState(false);
      const [isEditingEval, setIsEditingEval] = useState(false);

      const [editingLogId, setEditingLogId] = useState(null);
      const [editLogContent, setEditLogContent] = useState('');
      const [editLogDate, setEditLogDate] = useState('');

      useEffect(() => {
        setGoalInput(unit.goal || '');
        setAiEvaluation(unit.evaluation || '');
        setUnitTitleInput(unit.title);
      }, [unit.id, unit.title]);

      const handleSaveUnitTitle = () => {
        if (!unitTitleInput.trim()) return;
        onRenameUnitAll(unit.subject, unit.title, unitTitleInput.trim());
        setIsEditingUnitTitle(false);
      };

      const handleEvalChange = (e) => {
        const newVal = e.target.value;
        setAiEvaluation(newVal);
        onUpdateUnit({ ...unit, evaluation: newVal, status: unit.status === '未作成' ? '下書き' : unit.status });
      };

      const handleSaveGoal = () => {
        onUpdateUnit({ ...unit, goal: goalInput });
        setIsEditingGoal(false);
      };

      const handleAddRecord = (e) => {
        e.preventDefault();
        if (!logInput.trim()) return;
        onAddLog(logInput.trim(), logDate);
        setLogInput('');
      };

      const handleGenerateAIEvaluation = async () => {
        if (!apiKey) {
          alert('Gemini APIキーが設定されていません。画面上部の「APIキー未設定」からAPIキーを入力してください。');
          onOpenApiKeyModal();
          return;
        }

        if (logs.length === 0) {
          alert('日々の記録がありません。評価文を作成するにはまず日々の記録を入力してください。');
          return;
        }

        setIsGenerating(true);

        const logsText = logs.map(l => `・[${l.date}] ${l.content}`).join('\n');
        
        const systemPrompt = `あなたは特別支援学校の教員です。児童の様子を温かくかつ客観的に把握し、保護者や関係機関にも分かりやすい評価文を作成します。文章は必ず「です・ます調（敬体）」で統一してください。個人特定につながる表記は避け、一般的な教育用語を用いて記載してください。`;
        
        const userPrompt = `以下の情報を基に、個別の指導計画に記載する評価文を作成してください。

【単元名】
${unit.title}

【個人目標】
${unit.goal || '（未設定）'}

【日々の記録】
${logsText}

以下の条件を必ず守ってください。
1．日々の記録に書かれている事実だけを基にすること
2．記録にない事実や成果を追加しないこと
3．児童の変化や成長が分かる場合は具体的に記述すること
4．必要だった教師の支援が記録されている場合は記述すること
5．個別の指導計画に適した丁寧で客観的な文章にすること
6．否定的な表現ではなく、できたことや取り組みの変化を中心に表現すること
7．過度な推測をしないこと
8．150〜250文字程度でまとめること
9．文章の語尾は必ず丁寧な「敬体（です・ます調）」にすること（例: 〜取り組みました。〜が見られます。）

評価文のみを出力してください。`;

        try {
          // 有効なモデル指定 (gemini-3.5-flash) に変更
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey.trim()}`;

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userPrompt }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] }
            })
          });

          const data = await response.json();

          if (data.error) {
            alert(`APIエラーが発生しました:\n${data.error.message || 'APIキーが無効またはエラーが発生しました。'}`);
            setIsGenerating(false);
            return;
          }

          const generatedText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

          if (generatedText) {
            const trimmedText = generatedText.trim();
            setAiEvaluation(trimmedText);
            onUpdateUnit({ ...unit, evaluation: trimmedText, status: '下書き' });
          } else {
            alert('AIによる評価文の生成に失敗しました。もう一度お試しください。');
          }
        } catch (error) {
          console.error("AI Generation Error:", error);
          alert('通信エラーが発生しました。APIキーまたはネットワーク状態を確認してください。');
        } finally {
          setIsGenerating(false);
        }
      };

      const handleSaveEvaluationStatus = (status) => {
        onUpdateUnit({ ...unit, evaluation: aiEvaluation, status });
        setIsEditingEval(false);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">

                <span className="text-xs text-slate-500 font-bold">{student.name}</span>
              </div>
              <span className={`text-xs font-bold px-3 py-1 rounded-full border ${
                unit.status === '確定' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' :
                unit.status === '下書き' ? 'bg-amber-100 text-amber-800 border-amber-300' :
                'bg-slate-200 text-slate-600 border-slate-300'
              }`}>
                評価状態: {unit.status}
              </span>
            </div>

            <div>
              {isEditingUnitTitle ? (
                <div className="space-y-3 bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-300 shadow-xs">
                  <div className="text-xs font-bold text-emerald-900 flex items-center gap-1.5">
                    <Icon name="info" className="w-4 h-4 text-emerald-600 shrink-0" />
                    <span>単元名の変更は【全児童の「{unit.subject}」教科】に一括適用されます</span>
                  </div>
                  <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                    <input
                      type="text"
                      value={unitTitleInput}
                      onChange={(e) => setUnitTitleInput(e.target.value)}
                      className="p-3 bg-white border border-emerald-400 rounded-xl text-base font-bold w-full focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-inner"
                      placeholder="単元名を入力..."
                      autoFocus
                    />
                    <div className="flex items-center gap-2 shrink-0">
                      <button
                        onClick={handleSaveUnitTitle}
                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-3 rounded-xl text-xs shadow-md transition-all flex items-center gap-1.5"
                      >
                        <Icon name="check" className="w-4 h-4" />
                        全児童に一括適用
                      </button>
                      <button
                        onClick={() => { setUnitTitleInput(unit.title); setIsEditingUnitTitle(false); }}
                        className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-3 rounded-xl text-xs transition-all"

                        キャンセル
                      </button>
                    </div>
                  </div>
                </div>
              ) : (
                <div className="flex items-center justify-between flex-wrap gap-3">
                  <h2 className="text-2xl font-bold text-slate-800">{unit.title}</h2>
                  <button 
                    onClick={() => { setUnitTitleInput(unit.title); setIsEditingUnitTitle(true); }}
                    className="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 font-bold px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow-2xs transition-all active:scale-95 cursor-pointer"
                    title="全児童の同教科の単元名が一括で更新されます"
                  >
                    <Icon name="edit-3" className="w-4 h-4 text-emerald-600" />
                    <span>単元名を全児童一括変更</span>
                  </button>
                </div>
              )}
            </div>

            <div className="bg-emerald-50/60 rounded-2xl p-4 border border-emerald-100">
              <div className="flex items-center justify-between mb-2">

    // --- モーダル: クイック記録追加 ---
    function QuickRecordModal({ students, units, subjects, onClose, onSaveLog, onCreateUnitAndLog }) {
      const [selectedStudentId, setSelectedStudentId] = useState(students[0]?.id || '');
      const [selectedSubject, setSelectedSubject] = useState(subjects[0]);
      const [selectedUnitId, setSelectedUnitId] = useState('');
      const [newUnitTitle, setNewUnitTitle] = useState('');
      const [newUnitGoal, setNewUnitGoal] = useState('');
      const [logContent, setLogContent] = useState('');
      const [logDate, setLogDate] = useState(new Date().toISOString().split('T')[0]);

      const availableUnits = units.filter(u => u.studentId === selectedStudentId && u.subject === selectedSubject);

      useEffect(() => {
        if (availableUnits.length > 0) {
          setSelectedUnitId(availableUnits[0].id);
        } else {
          setSelectedUnitId('new');
        }
      }, [selectedStudentId, selectedSubject]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!logContent.trim()) return;

        if (selectedUnitId === 'new') {
          if (!newUnitTitle.trim()) {
            alert('新しい単元名を入力してください');
            return;
          }
          onCreateUnitAndLog(selectedStudentId, selectedSubject, newUnitTitle.trim(), newUnitGoal.trim(), logContent.trim(), logDate);
        } else {
          onSaveLog(selectedUnitId, logContent.trim(), logDate);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 my-8">

                  value={selectedStudentId}
                  onChange={(e) => setSelectedStudentId(e.target.value)}
                  className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold focus:ring-2 focus:ring-emerald-500"

                    <button
                      key={subj}

                      }`}
                    >
                      {subj}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">単元</label>
                <select 
                  value={selectedUnitId}
                  onChange={(e) => setSelectedUnitId(e.target.value)}
                  className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-emerald-500"

                <input 
                  type="date"
                  value={logDate}
                  onChange={(e) => setLogDate(e.target.value)}
                  className="p-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">記録内容</label>
                <textarea
                  value={logContent}
                  onChange={(e) => setLogContent(e.target.value)}
                  placeholder="児童の様子やできたこと、必要だった支援などを自由に入力..."
                  className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm min-h-[90px] focus:ring-2 focus:ring-amber-400"
                ></textarea>
              </div>

              <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl text-slate-600 bg-slate-100 font-bold text-xs"
                >
                  キャンセル
                </button>
                <button
                  type="submit"
                  disabled={!logContent.trim()}
                  className="px-5 py-2 rounded-xl text-white bg-amber-500 hover:bg-amber-600 font-bold text-xs shadow-xs"
                >
                  保存する
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- モーダル: 児童追加 ---
    function AddStudentModal({ onClose, onAdd }) {
      const [name, setName] = useState('');

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
            <h3 className="font-bold text-lg text-slate-800">児童の新規登録</h3>
            <div>
              <label className="block text-xs font-bold text-slate-600 mb-1">表示用名称（イニシャル・仮名を推奨）</label>
              <input
                type="text"
                placeholder="例: 児童A"
                value={name}
                onChange={(e) => setName(e.target.value)}
                className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-base focus:ring-2 focus:ring-emerald-500"
                autoFocus
              />
            </div>
            <div className="flex justify-end gap-2 pt-2">
              <button
                onClick={onClose}
                className="px-4 py-2 rounded-xl text-slate-600 bg-slate-100 font-bold text-xs"
              >
                キャンセル
              </button>
              <button
                onClick={() => onAdd(name)}
                disabled={!name.trim()}
                className="px-5 py-2 rounded-xl text-white bg-emerald-600 hover:bg-emerald-700 font-bold text-xs shadow-xs"
              >
                登録
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- モーダル: Word 出力 ---
    function WordExportModal({ student, units, subjects, onClose }) {
      const [onlyConfirmed, setOnlyConfirmed] = useState(true);
      const [isExporting, setIsExporting] = useState(false);

      const currentDateStr = new Date().toLocaleDateString('ja-JP', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      const handleDownloadWord = async () => {
        setIsExporting(true);

        try {
          const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType } = window.docx;

          const filteredUnits = units.filter(u => onlyConfirmed ? u.status === '確定' : true);

          const tableRows = [
            new TableRow({
              children: [
                new TableCell({
                  width: { size: 15, type: WidthType.PERCENTAGE },
                  children: [new Paragraph({ children: [new TextRun({ text: "教科・領域", bold: true })] })],
                  shading: { fill: "E2EFDA" },
                }),
                new TableCell({
                  width: { size: 25, type: WidthType.PERCENTAGE },
                  children: [new Paragraph({ children: [new TextRun({ text: "単元名・個人目標", bold: true })] })],
                  shading: { fill: "E2EFDA" },
                }),
                new TableCell({
                  width: { size: 60, type: WidthType.PERCENTAGE },
                  children: [new Paragraph({ children: [new TextRun({ text: "評価", bold: true })] })],
                  shading: { fill: "E2EFDA" },
                }),
              ],
            }),
          ];

          subjects.forEach(subject => {
            const subjectUnits = filteredUnits.filter(u => u.subject === subject);

            if (subjectUnits.length === 0) {
              tableRows.push(
                new TableRow({
                  children: [
                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: subject, bold: true })] })] }),
                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "（未登録）", italics: true, color: "888888" })] })] }),
                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "（未登録）", italics: true, color: "888888" })] })] }),
                  ],
                })
              );
            } else {
              subjectUnits.forEach(u => {
                tableRows.push(
                  new TableRow({
                    children: [
                      new TableCell({
                        children: [new Paragraph({ children: [new TextRun({ text: subject, bold: true })] })],
                      }),
                      new TableCell({
                        children: [
                          new Paragraph({ children: [new TextRun({ text: `【単元】${u.title}`, bold: true })] }),
                          new Paragraph({ children: [new TextRun({ text: `【目標】${u.goal || '（未設定）'}` })] }),
                        ],
                      }),
                      new TableCell({
                        children: [
                          new Paragraph({
                            children: [new TextRun({ text: u.evaluation || '（評価未作成）' })]
                          })
                        ],
                      }),
                    ],
                  })
                );
              });
            }
          });

          const doc = new Document({
            sections: [
              {
                properties: {},
                children: [
                  new Paragraph({
                    text: "個別の指導計画 評価記録",
                    heading: "Heading1",
                    alignment: AlignmentType.CENTER,
                  }),
                  new Paragraph({ text: "" }),
                  new Paragraph({
                    children: [
                      new TextRun({ text: `対象: `, bold: true }),
                      new TextRun({ text: `${student.name}  ` }),
                      new TextRun({ text: `出力日: `, bold: true }),
                      new TextRun({ text: `${currentDateStr}` }),
                    ],
                    alignment: AlignmentType.RIGHT,
                  }),
                  new Paragraph({ text: "" }),
                  new Table({
                    rows: tableRows,
                    width: { size: 100, type: WidthType.PERCENTAGE },
                  }),
                ],
              },
            ],
          });

          const blob = await Packer.toBlob(doc);
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `個別の指導計画_${student.name}_${new Date().toISOString().split('T')[0]}.docx`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (err) {
          console.error("Word Document Generation Error:", err);
          alert('Wordファイルの生成に失敗しました。');
        } finally {
          setIsExporting(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-5 my-8">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                <Icon name="file-text" className="w-5 h-5 text-emerald-600" />
                個別の指導計画 出力 (Word)
              </h3>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-slate-100 text-slate-400">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="bg-emerald-50 rounded-2xl p-4 border border-emerald-100 space-y-2">
              <div className="flex items-center justify-between">
                <span className="font-bold text-sm text-slate-700">対象: {student.name}</span>
                <span className="text-xs text-slate-500">出力日: {currentDateStr}</span>
              </div>
              <label className="flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer pt-2">
                <input
                  type="checkbox"
                  checked={onlyConfirmed}
                  onChange={(e) => setOnlyConfirmed(e.target.checked)}
                  className="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500"
                />
                <span>「確定済み」の評価のみ出力する（チェックを外すと下書きも含む）</span>
              </label>
            </div>

            <div className="space-y-2">
              <h4 className="text-xs font-bold text-slate-500 uppercase">出力内容プレビュー</h4>
              <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 max-h-[260px] overflow-y-auto custom-scrollbar text-xs space-y-3">
                {subjects.map(subj => {
                  const targetUnits = units.filter(u => u.subject === subj && (onlyConfirmed ? u.status === '確定' : true));
                  return (
                    <div key={subj} className="border-b border-slate-200 pb-2">
                      <div className="font-bold text-emerald-800 mb-1">【{subj}】</div>
                      {targetUnits.length === 0 ? (
                        <div className="text-slate-400 italic">該当する指導評価がありません</div>
                      ) : (
                        targetUnits.map(u => (
                          <div key={u.id} className="ml-2 space-y-0.5">
                            <div className="font-bold text-slate-700">単元: {u.title}</div>
                            <div className="text-slate-600">目標: {u.goal || '（未設定）'}</div>
                            <div className="text-slate-800 bg-white p-2 rounded border border-slate-200 mt-1">
                              評価: {u.evaluation || '（未作成）'}
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="flex items-center justify-end gap-3 pt-2">
              <button
                onClick={onClose}
                className="px-4 py-2 rounded-xl text-slate-600 bg-slate-100 font-bold text-xs"
              >
                キャンセル
              </button>
              <button
                onClick={handleDownloadWord}
                disabled={isExporting}
                className="px-6 py-2.5 rounded-xl text-white bg-emerald-700 hover:bg-emerald-800 font-bold text-xs shadow-md flex items-center gap-2 active:scale-95"
              >
                <Icon name="download" className="w-4 h-4" />
                <span>{isExporting ? '生成中...' : 'Word (.docx) をダウンロード'}</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
